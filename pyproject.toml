[project]
name = "ledgerline"
version = "0.1.0"
description = "Small invoicing and payments service used to showcase Harpy PR reviews"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
